data_dir: data

rolling:
  windows_years: [3, 5]
  step: "1w"          # weekly Friday close; flip to "1d" for daily audit run

returns:
  trading_days_per_year: 252
  regression_basis: log
  display_basis: simple

ingest:
  amfi_nav:
    # 2013-01-01 = SEBI's mandated Direct Plan launch date. Pre-2013 there were
    # only Regular Plans, which we don't rank anyway.
    backfill_start: "2013-01-01"
    bulk_window_days: 90
  benchmarks:
    history_start: "2013-01-01"

quality:
  # 3 is the live deliberate history gate (A1-5 wired it into the
  # orchestrator; the old YAML value of 5 was dead config). Moving to 5y is
  # a separate product decision.
  min_history_years_for_ranking: 3
  max_missing_pct_in_window: 0.05
  # A1-3 per-scheme staleness gate: last NAV older than the N-th-from-last
  # trading day <= as_of -> data_quality_flag STALE (visible in
  # computed_metrics, excluded from ranking as STALE_NAV). 10 trading days
  # = 2x freshness.max_nav_lag_bdays: tolerates per-scheme publication lag,
  # catches anything dead for weeks.
  max_scheme_nav_lag_bdays: 10
  # A1-9: per-scheme compute failures skip-and-report up to this fraction of
  # attempted schemes; beyond it the run halts (PipelineError) instead of
  # silently shrinking the universe.
  max_scheme_compute_failure_rate: 0.01

freshness:
  # Maximum acceptable staleness for each curated dataset. Pipeline hard-fails
  # before compute/rank if any check is exceeded.
  max_nav_lag_bdays: 5             # AMFI NAV (Indian business days)
  max_bench_lag_bdays: 5           # NSE equity TRI closes
  max_rf_lag_days: 14              # 91-day T-bill auction (weekly; allow holiday slip)
  max_scheme_master_lag_days: 1    # scheme master rebuilt within last day
  max_tbill_scrape_failure_rate: 0.05  # halt T-bill walk if >5% of prids fail their retries
  # Interior-gap gate (coverage Gate A, nav_daily only): max trading days among
  # the last 30 (NIFTY 50 TRI calendar) whose nav_daily row count is below
  # 0.5x the trailing-3y median daily count (~8,600 → floor ~4,300). null
  # disables the check (rollback switch). Threshold rationale:
  # quality.max_missing_pct_in_window (0.05) is the PER-SCHEME 3y tolerance
  # (~37 days) and can never catch a fresh systemic hole (the 2026-05/06 hole
  # was 1.2% of 3y); this gate instead allows 2 sub-floor days per 30 trading
  # days (~6.7%), one above the special-session (Muhurat / budget Saturday)
  # base rate of ≤1 per any 30-trading-day span.
  max_nav_interior_gap_days: 2
  # Phase 2.2+/2.3 monthly & quarterly signals (B7/D9: real thresholds; the
  # nulls were a Phase-2 bootstrap and the tables have long since shipped).
  # Halting-semantics classification:
  #   BLOCKING  = whole-source staleness, enforced by freshness.check_freshness
  #               (raise_on_fail=True before compute). These thresholds gate
  #               the GLOBAL MAX(date) of each table: a breach means the entire
  #               source went dark for more than one publication cycle —
  #               systemic, so the run halts (fail-fast invariant).
  #   ADVISORY  = per-fund / per-AMC coverage, reported by coverage Gate B
  #               (never halts): one AMC's missing PTR or holdings must not
  #               stop the run; the affected funds are excluded or penalized
  #               downstream and the gap is attributed in the Gate B report.
  # Calibration (empirical table MAX dates verified live 2026-06-13):
  # Holdings: monthly, AMFI mandate publish-by-10th-of-next-month. MAX
  # 2026-05-01 (lag 43d) — 75d allows one fully missed monthly cycle + slack.
  max_holdings_lag_days: 75
  # Constituents: derived monthly from index-tracker holdings — D9 put
  # ingest/constituents/derive.py on the pipeline cadence (stage 'derive
  # constituents'), so a stalled derivation halts the run within ~2 cycles.
  # MAX 2026-04-01 (lag 73d at calibration): the 2026-05 derive must run with
  # this change or the gate trips ~2026-06-15. Remediation (~10 min):
  #   uv run python tools/derive_constituents.py --ym <YYYY-MM>
  #   uv run mfs ingest constituents
  max_constituents_lag_days: 75
  # PTR: same factsheet source/cadence as holdings; MAX 2026-05-01 (lag 43d).
  # This gates the GLOBAL MAX(as_of_month) via q.latest_ptr_date, so quant's
  # deliberate annual-report-only PTR rows (2024-03) can never trip it — no
  # per-AMC exemption machinery needed (per-AMC gaps stay in Gate B).
  max_ptr_lag_days: 75
  # Stock ADV: NSE bhavcopy is daily with a 75d ingest window; MAX 2026-06-11
  # (lag 2d). 10d tolerates holiday clusters + weekend slip while catching a
  # dead scraper within two weeks.
  max_stock_adv_lag_days: 10
  # AAUM: AMFI publishes QUARTERLY, ~45d after quarter end; MAX 2026-03-01
  # (lag 104d at calibration is nominal). 150d halts only if an entire
  # quarterly publication is skipped.
  max_aum_lag_days: 150

filters:
  plan_type: DIRECT
  option_type: GROWTH
  # A2-1: single source of truth for the Stage-1 hard-filter floors —
  # rank/filters.py reads these via get_pipeline_config(). Values are the
  # deliberately relaxed floors (drop only catastrophically broken funds;
  # surviving-but-weak funds rank lower via the composite instead).
  capture_efficiency_min: 0.50
  info_ratio_3y_min: -1.00
  r_squared_band: [0.40, 1.00]   # upper bound 1.00 keeps index-hugging funds visible
  beta_band: [0.30, 1.70]        # generic band (replaced the per-category bands)

# D10 — ret_median/ret_p25 redundancy (deliberately ACCEPTED for now):
# ret_median/ret_p25 within-category corr ~0.92-0.97 (audit 2026-06-10), so
# the four return weights below act as two ~0.25 blocks (3y block = median
# 0.15 + p25 0.10; 5y block likewise) and the total trailing-performance
# load is ~0.75 (returns 0.50 + alpha 0.25). The nominal 0.15/0.10 splits
# are false precision, but collapsing them would reorder every category
# without validation — the collapse decision is deferred to the
# tools/backtest_ic.py sensitivity variant p25_collapsed
# (ret_3y_median 0.25 / ret_5y_median 0.25 / p25 weights 0).
composite_weights_stage1:
  # Stage 1 — Performance & Consistency only. Positive weights sum to 1.00.
  # No Phase 2 metrics; no pro-rata redistribution — the D2 core-metric gate
  # (rank/filters.py split_core_complete, A2-2) hard-drops funds missing any
  # core Stage-1 metric before scoring, so every scored fund has real values
  # behind its z-scores (the 5y pair may proxy from 3y for young funds).
  ret_3y_median: 0.15
  ret_3y_p25:    0.10
  ret_5y_median: 0.15
  ret_5y_p25:    0.10
  alpha_3y:      0.25
  sortino_3y:    0.10
  info_ratio_3y: 0.10
  capture_efficiency: 0.05

composite_weights_stage2:
  # Stage 2 — re-rank the top-20 per category from Stage 1 with Phase 2
  # metrics layered in. Positive weights sum to 0.85 (deliberately NOT
  # renormalized to 1.00 — z-composites are scale-invariant within a
  # cohort); style_drift is a signed penalty subtracted on top, and PTR +
  # AUM-Impact soft penalties ramp on top of that.
  ret_3y_median: 0.10
  ret_3y_p25:    0.07
  ret_5y_median: 0.10
  ret_5y_p25:    0.07
  alpha_3y:      0.20
  sortino_3y:    0.08
  info_ratio_3y: 0.08
  capture_efficiency: 0.05
  active_share:  0.10
  style_drift:  -0.05

soft_penalties:
  # Non-linear deductions layered on top of the Stage 2 z-score composite.
  # Each penalty has its own enabled flag so we can A/B individual signals
  # without re-balancing the weights vector. Stage 1 ignores these.
  ptr:
    enabled: true
    max_penalty: 0.05
    threshold: 1.50        # 150% PTR begins the ramp (Phase 2.2.H)
  # A2-10: categories whose multi-x turnover is structural arbitrage
  # mechanics, not churn (20 of 31 funds with PTR > 1.5 are these two) —
  # exempt from the PTR ramp entirely. Revisit with the D3 backtest
  # (alternative: category-relative percentile ramp).
  ptr_penalty_exempt_categories:
    - Balanced Advantage
    - Equity Savings
  aum_impact_cost:
    enabled: true
    max_penalty: 0.05
    threshold_days: 5.0    # days-to-liquidate above 5 begins the ramp
    # A2-6: log-scale ramp — penalty = max_penalty *
    # clip(ln(days/threshold_days)/ln(saturation_days/threshold_days), 0, 1).
    # Calibrated vs the survivor distribution (median ~13d / Small Cap median
    # 79d / p95 163d / max 924d): 10d -> ~0.0075, 79d -> ~0.030,
    # 163d -> ~0.038, >=500d -> 0.05 (cap).
    saturation_days: 500
  missing_disclosure:
    enabled: true
    # D3 (A2-4): fixed penalty applied once per missing *live* disclosure
    # metric (ptr_latest / style_drift_3y / aum_impact_cost_days /
    # active_share_median_1y once it activates) — soft-neutral replacement for
    # the old hard drop. CALIBRATION (2026-06-13, on the live 2026-06-12
    # rank_history partition; re-derive after any recompute):
    #   SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY pen)
    #          FILTER (WHERE pen > 0)
    #   FROM (SELECT LEAST(0.05, GREATEST(0, (ptr_latest - 1.5)/1.5) * 0.05)
    #                AS pen
    #         FROM rank_history
    #         WHERE as_of_date = '2026-06-12' AND stage = 2 AND included) t;
    #   -> 0.025667 (6 of 114 survivors penalized) -> round(., 3) = 0.026.
    penalty: 0.026

pipeline_version: "v2.3.0-phase2.3a"
