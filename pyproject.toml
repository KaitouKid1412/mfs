[project]
name = "mfs"
version = "0.1.0"
description = "Indian mutual fund evaluation pipeline (NAV-based ranking)"
requires-python = ">=3.11,<3.15"
dependencies = [
  "polars~=1.20",
  "pyarrow>=17",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "rich>=13.7",
  "numpy>=1.26",
  "cryptography>=48.0.0",
  "psycopg[binary]>=3.1",
  # Phase 2.1+: factsheet PDF parsing + fuzzy scheme-name matching.
  "pdfplumber>=0.11",
  "rapidfuzz>=3.9",
  "xlrd>=2.0.1",
]

[project.scripts]
mfs = "mfs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfs"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
